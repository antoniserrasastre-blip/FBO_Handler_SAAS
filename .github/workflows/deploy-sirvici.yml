name: Deploy to Sirvici

on:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: pdf-microservice tests
        run: |
          cd pdf-microservice
          npm ci
          npm test

  deploy:
    name: Build & Deploy
    needs: verify
    runs-on: [self-hosted, sirvici]
    timeout-minutes: 15

    steps:
      - name: Pull latest code
        run: |
          cd /srv/fbo-handler-saas
          git fetch origin main
          git reset --hard origin/main

      - name: Build and restart containers
        run: |
          cd /srv/fbo-handler-saas
          docker compose build --no-cache
          docker compose up -d

      - name: Sync database schema (idempotente)
        run: |
          cd /srv/fbo-handler-saas
          # Espera a que el container esté listo para `exec` (no a que Next
          # responda — Next puede crashear si el schema está stale).
          for i in $(seq 1 15); do
            if docker compose exec -T fbo true 2>/dev/null; then break; fi
            sleep 1
          done
          # `prisma db push` aplica el schema actual a la BD (crea tablas si no
          # existen, añade columnas nuevas). Idempotente: no hace nada si todo
          # está alineado. Se ejecuta SIEMPRE tras el deploy, no solo first run.
          docker compose exec -T -u root fbo \
            node /app/_cli/node_modules/prisma/build/index.js db push \
            --schema=/app/prisma/schema.prisma \
            --skip-generate \
            --accept-data-loss
          # Si la app crasheó en startup por schema viejo, reinicia tras el push.
          docker compose restart fbo

      - name: Wait for healthcheck
        run: |
          echo "Esperando a que FBO arranque..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "FBO Handler arrancado correctamente"
              exit 0
            fi
            sleep 2
          done
          echo "AVISO: FBO no respondió tras 60s"
          docker compose -f /srv/fbo-handler-saas/docker-compose.yml logs --tail=30
          exit 1
