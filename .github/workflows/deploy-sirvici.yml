name: Deploy to Sirvici

on:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: pdf-microservice tests
        run: |
          cd pdf-microservice
          npm ci
          npm test

  deploy:
    name: Build & Deploy
    needs: verify
    runs-on: [self-hosted, sirvici]
    timeout-minutes: 15

    steps:
      - name: Pull latest code
        run: |
          cd /home/randomite/FBO_Handler_SAAS
          git fetch origin main
          git reset --hard origin/main

      - name: Build and restart containers
        run: |
          cd /home/randomite/FBO_Handler_SAAS
          docker compose build --no-cache
          docker compose up -d

      - name: Wait for healthcheck
        run: |
          echo "Esperando a que FBO arranque..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "FBO Handler arrancado correctamente"
              exit 0
            fi
            sleep 2
          done
          echo "AVISO: FBO no respondió tras 60s"
          docker compose -f /home/randomite/FBO_Handler_SAAS/docker-compose.yml logs --tail=30
          exit 1

      - name: Init database (first run only)
        run: |
          cd /home/randomite/FBO_Handler_SAAS
          # Si la DB no existe, crear schema y seed
          if ! docker compose exec fbo test -f /app/data/fbo.db; then
            docker compose exec fbo npx prisma db push
            echo "Schema creado. Seed manual si es necesario."
          fi
