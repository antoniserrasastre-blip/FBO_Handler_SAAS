services:
  fbo:
    build: .
    container_name: fbo-handler
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      # SQLite persistente fuera del contenedor
      - fbo-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/fbo.db
      - NEXTAUTH_URL=https://fbo.randomite.space
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fbo-data:
