services:
  fbo:
    build: .
    container_name: fbo-handler
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      # SQLite persistente fuera del contenedor
      - fbo-data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      # La imagen runtime (node:20-slim) no trae wget ni curl; usamos node, que
      # siempre está. <500 (incluye el 307→/login de NextAuth) cuenta como sano.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  fbo-data:
    name: fbo_handler_saas_fbo-data
