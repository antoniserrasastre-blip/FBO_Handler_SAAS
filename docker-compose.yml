services:
  fbo:
    build: .
    container_name: fbo-handler
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      # SQLite persistente fuera del contenedor
      - fbo-data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fbo-data:
    name: fbo_handler_saas_fbo-data
